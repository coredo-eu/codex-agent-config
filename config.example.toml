service_tier = "default"

# Current high-trust local values. Enable only after an explicit local review.
# approval_policy = "never"
# sandbox_mode = "danger-full-access"

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.codeindexer]
url = "http://127.0.0.1:8978/mcp"

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-claude-orchestrator@codex-claude-orchestrator"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[features]
js_repl = false

[features.multi_agent_v2]
multi_agent_mode_hint_text = "Applicable AGENTS.md and skill executor-selection rules are explicit delegation instructions. Follow them without requiring the user to repeat a Claude request. Codex-owned Claude PTY transport is not native sub-agent fan-out. Otherwise, do not spawn native Codex sub-agents proactively."
