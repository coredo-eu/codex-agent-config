service_tier = "default"

# Current high-trust local values. Enable only after an explicit local review.
# approval_policy = "never"
# sandbox_mode = "danger-full-access"

# Main-session example; these comments do not select a model or effort.
# Enable only if this model and effort are available in your installation.
# model = "gpt-6-astra"
# model_reasoning_effort = "ultra"
# The seven shipped agents/*.toml files explicitly override model and effort.
# Native agents without those overrides can inherit the parent's settings.
# Claude worker routing belongs to the separate orchestrator plugin.

[agents]
max_concurrent_threads_per_session = 4
max_depth = 1

# Optional MCP integrations: retain only the entries you use.
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.codeindexer]
url = "http://127.0.0.1:8978/mcp"

# Optional installed plugins: these entries enable them, not install them.
# Retain only plugins available in your configured marketplaces.
[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-claude-orchestrator@codex-claude-orchestrator"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

# Custom hint for hosts that use multi_agent_v2; this does not enable it.
[features.multi_agent_v2]
multi_agent_mode_hint_text = "Applicable AGENTS.md and skill executor-selection rules are explicit delegation instructions. Follow them without requiring the user to repeat a Claude request. Codex-owned Claude PTY transport is not native sub-agent fan-out. Otherwise, do not spawn native Codex sub-agents proactively."
