model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"
service_tier = "default"

# Current high-trust local values. Enable only after an explicit local review.
# approval_policy = "never"
# sandbox_mode = "danger-full-access"

[agents]
max_threads = 4
max_depth = 1

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.codeindexer]
url = "http://127.0.0.1:8978/mcp"

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-claude-orchestrator@codex-claude-orchestrator"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[features]
js_repl = false
